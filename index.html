<!DOCTYPE html>
<html lang="am" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>አቢሲኒያ ብራና — የትምህርት መጻሕፍት ቤተ-መጻሕፍት</title>
<meta name="description" content="የ8ኛ እስከ 12ኛ ክፍል የትምህርት መጻሕፍትን በነጻ ያውርዱ">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Ethiopic:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:       #17120f;
    --ink-raised:#221b14;
    --ink-line:  #3c3020;
    --parchment: #f1e2bf;
    --parchment-dim: #b9a97c;
    --gold:      #cf9f43;
    --gold-dim:  #8a6a2e;
    --maroon:    #a4433c;
    --maroon-dim:#5c2523;
    --radius-cover: 3px 10px 10px 3px;
    --serif: 'Noto Serif Ethiopic', serif;
    --sans: 'Noto Sans Ethiopic', sans-serif;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background: var(--ink);
    color: var(--parchment);
    font-family: var(--sans);
    min-height:100vh;
    display:flex; flex-direction:column;
  }
  ::selection{ background: var(--gold); color: var(--ink); }

  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    opacity:.05;
    background-image:
      radial-gradient(circle at 20% 30%, var(--parchment) 0, transparent 45%),
      radial-gradient(circle at 80% 70%, var(--gold) 0, transparent 40%);
  }

  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  :focus-visible{ outline: 2px solid var(--gold); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }

  header{
    position:sticky; top:0; z-index:50;
    background: rgba(23,18,15,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--ink-line);
  }
  .header-inner{
    max-width:1080px; margin:0 auto;
    padding: 14px 20px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand svg{ width:34px; height:34px; flex-shrink:0; }
  .brand-name{ font-family:var(--serif); font-weight:700; font-size:17px; color:var(--parchment); line-height:1.1; }
  .brand-tag{ font-size:11px; color:var(--gold); font-weight:500; letter-spacing:.02em; }

  .nav-search-btn{
    display:flex; align-items:center; gap:8px;
    padding:9px 16px;
    border:1px solid var(--gold-dim);
    color:var(--gold);
    font-size:13px; font-weight:600;
    border-radius:2px;
    transition: background .2s, color .2s;
  }
  .nav-search-btn:hover{ background:var(--gold); color:var(--ink); }

  .hero{
    position:relative;
    max-width:780px; margin:0 auto;
    padding: 64px 20px 48px;
    text-align:center;
  }
  .hero-emblem{ width:46px; height:46px; margin:0 auto 22px; opacity:.9; }
  .hero h2{
    font-family:var(--serif);
    font-weight:700;
    font-size: clamp(28px, 5.4vw, 46px);
    line-height:1.25;
    color:var(--parchment);
    margin: 0 0 18px;
  }
  .hero h2 em{
    font-style:normal;
    color:var(--gold);
  }
  .hero p{
    color: var(--parchment-dim);
    font-size:15px;
    line-height:1.75;
    max-width:480px;
    margin: 0 auto 30px;
  }
  .hero-rule{
    width:64px; height:2px; margin:0 auto 30px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .hero-cta{
    display:inline-flex; align-items:center; gap:10px;
    padding:15px 30px;
    background: var(--gold);
    color: var(--ink);
    font-weight:700; font-size:14px;
    border-radius:2px;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .hero-cta:hover{ transform: translateY(-2px); box-shadow: 0 10px 22px -8px rgba(207,159,67,.45); }
  .hero-cta svg{ width:16px; height:16px; }

  .grade-picker{
    display:flex; flex-wrap:wrap; justify-content:center; gap:10px;
    max-width:560px; margin: 44px auto 0;
  }
  .grade-tag{
    position:relative;
    padding: 12px 20px 12px 16px;
    background: var(--ink-raised);
    border:1px solid var(--ink-line);
    font-family:var(--serif); font-weight:600; font-size:14px;
    color: var(--parchment);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 8px 100%, 0 70%);
    transition: border-color .2s, color .2s;
  }
  .grade-tag:hover{ border-color: var(--gold-dim); color: var(--gold); }
  .grade-tag span{ color:var(--gold); margin-inline-end:4px; }

  #library{
    max-width:1080px; margin:0 auto; width:100%;
    padding: 40px 20px 80px;
    border-top: 1px solid var(--ink-line);
  }

  .catalog-bar{
    display:flex; flex-direction:column; gap:14px;
    margin-bottom:38px;
  }
  .search-row{
    position:relative;
  }
  .search-row svg{
    position:absolute; left:15px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; color:var(--parchment-dim);
  }
  .search-row input{
    width:100%;
    background: var(--ink-raised);
    border:1px solid var(--ink-line);
    color: var(--parchment);
    font-family:inherit; font-size:14px;
    padding: 13px 16px 13px 42px;
    border-radius:2px;
  }
  .search-row input::placeholder{ color: var(--parchment-dim); }
  .search-row input:focus{ border-color:var(--gold-dim); }

  .tab-row{
    display:flex; gap:4px; overflow-x:auto;
    border-bottom: 1px solid var(--ink-line);
  }
  .tab-btn{
    flex-shrink:0;
    padding: 10px 18px;
    font-size:13px; font-weight:600;
    color: var(--parchment-dim);
    border-bottom: 2px solid transparent;
    transition: color .2s, border-color .2s;
    white-space:nowrap;
  }
  .tab-btn:hover{ color:var(--parchment); }
  .tab-btn.active-tab{ color: var(--gold); border-color: var(--gold); }

  .shelf{ margin-bottom: 52px; }
  .shelf:last-child{ margin-bottom:0; }
  .shelf-head{
    display:flex; align-items:baseline; gap:12px;
    margin-bottom:20px;
  }
  .shelf-head h3{
    font-family:var(--serif); font-weight:700; font-size:19px;
    color:var(--parchment); margin:0;
  }
  .shelf-head .count{ font-size:12px; color:var(--parchment-dim); }

  .book-row{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 22px 16px;
    padding-bottom: 14px;
    position:relative;
  }
  .book-row::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0;
    height:3px;
    background: linear-gradient(180deg, var(--gold-dim), transparent);
    opacity:.35;
  }

  .book{
    display:flex; flex-direction:column;
  }
  .cover{
    position:relative;
    aspect-ratio: 3/4.1;
    background: var(--ink-raised);
    border: 1px solid var(--ink-line);
    border-radius: var(--radius-cover);
    display:flex; align-items:center; justify-content:center;
    padding: 14px;
    overflow:hidden;
    transition: transform .2s ease, border-color .2s ease;
  }
  .cover::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:7px;
    background: linear-gradient(90deg, rgba(0,0,0,.5), transparent);
  }
  .cover img{ max-height:100%; max-width:100%; object-fit:contain; filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
  .book:hover .cover{ transform: translateY(-3px); border-color: var(--gold-dim); }

  .grade-chip{
    position:absolute; top:8px; right:8px;
    font-size:10px; font-weight:700;
    color: var(--gold);
    background: rgba(23,18,15,.85);
    border:1px solid var(--gold-dim);
    padding: 2px 7px;
    border-radius: 2px;
  }
  .book-title{
    font-size:12.5px; font-weight:600; color:var(--parchment);
    line-height:1.45;
    margin: 10px 0 10px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    min-height: 34px;
  }
  .download-link{
    display:flex; align-items:center; justify-content:center; gap:6px;
    border:1px solid var(--maroon-dim);
    color: var(--parchment);
    font-size:11.5px; font-weight:700;
    padding: 8px 0;
    border-radius: 0 0 3px 3px;
    margin-top:auto;
    transition: background .2s, border-color .2s;
  }
  .download-link:hover{ background: var(--maroon); border-color: var(--maroon); }
  .download-link svg{ width:12px; height:12px; }

  .empty-state{
    text-align:center; padding: 60px 20px;
    color: var(--parchment-dim);
  }
  .empty-state svg{ width:40px; height:40px; margin:0 auto 14px; opacity:.5; }
  .empty-state p{ font-size:13.5px; }

  footer{
    border-top:1px solid var(--ink-line);
    text-align:center;
    padding: 28px 20px;
    color: var(--parchment-dim);
    font-size:11.5px;
  }

  @keyframes rise{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
  .hero-emblem, .hero h2, .hero p, .hero-rule, .hero-cta, .grade-picker{
    animation: rise .7s ease both;
  }
  .hero h2{ animation-delay:.05s; }
  .hero p{ animation-delay:.12s; }
  .hero-rule{ animation-delay:.18s; }
  .hero-cta{ animation-delay:.24s; }
  .grade-picker{ animation-delay:.3s; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="#" class="brand" onclick="resetHome()">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="38" height="38" rx="4" stroke="#cf9f43" stroke-width="1.4"/>
        <path d="M20 9 L20 31 M13 13 C13 13 16 11 20 14 C24 11 27 13 27 13 L27 27 C27 27 24 25 20 28 C16 25 13 27 13 27 Z" stroke="#cf9f43" stroke-width="1.3" stroke-linejoin="round" fill="none"/>
      </svg>
      <div>
        <div class="brand-name">አቢሲኒያ ብራና</div>
        <div class="brand-tag">ዲጂታል ቤተ-መጻሕፍት</div>
      </div>
    </a>
    <button class="nav-search-btn" onclick="scrollToLibrary()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span>መጻሕፍት</span>
    </button>
  </div>
</header>

<main style="flex:1;">
  <section class="hero">
    <svg class="hero-emblem" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 6 L20 34 M10 11 C10 11 15 8 20 12 C25 8 30 11 30 11 L30 29 C30 29 25 26 20 30 C15 26 10 29 10 29 Z" stroke="#cf9f43" stroke-width="1.4" stroke-linejoin="round" fill="none"/>
    </svg>
    <h2>የትምህርት መጻሕፍትን <em>በክብር</em><br>እና በቀላሉ ያግኙ</h2>
    <p>የኢትዮጵያ የ8ኛ እስከ 12ኛ ክፍል መጻሕፍት፣ በምዕራፍ እና በደረጃ የተደራጁ፣ ያለ ምንም ክፍያ ለማውረድ ዝግጁ ሆነው እዚህ ይጠብቁዎታል።</p>
    <div class="hero-rule"></div>
    <a href="#library" class="hero-cta" onclick="scrollToLibrary(); return false;">
      <span>ወደ ቤተ-መጻሕፍቱ ይግቡ</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    </a>

    <div class="grade-picker">
      <button class="grade-tag" onclick="selectGradeAndScroll('8')"><span>8ኛ</span>ክፍል</button>
      <button class="grade-tag" onclick="selectGradeAndScroll('9')"><span>9ኛ</span>ክፍል</button>
      <button class="grade-tag" onclick="selectGradeAndScroll('10')"><span>10ኛ</span>ክፍል</button>
      <button class="grade-tag" onclick="selectGradeAndScroll('11')"><span>11ኛ</span>ክፍል</button>
      <button class="grade-tag" onclick="selectGradeAndScroll('12')"><span>12ኛ</span>ክፍል</button>
    </div>
  </section>

  <section id="library">
    <div class="catalog-bar">
      <div class="search-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" oninput="filterBooks()" placeholder="የመጽሐፍ ስም ይፈልጉ — ለምሳሌ Mathematics, Physics...">
      </div>
      <div class="tab-row">
        <button class="tab-btn active-tab" id="btn-all" onclick="filterGrade('all')">ሁሉም</button>
        <button class="tab-btn" id="btn-8" onclick="filterGrade('8')">8ኛ ክፍል</button>
        <button class="tab-btn" id="btn-9" onclick="filterGrade('9')">9ኛ ክፍል</button>
        <button class="tab-btn" id="btn-10" onclick="filterGrade('10')">10ኛ ክፍል</button>
        <button class="tab-btn" id="btn-11" onclick="filterGrade('11')">11ኛ ክፍል</button>
        <button class="tab-btn" id="btn-12" onclick="filterGrade('12')">12ኛ ክፍል</button>
      </div>
    </div>

    <div id="shelves"></div>

    <div id="emptyState" class="empty-state" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7l9-4 9 4M3 7v11l9 4 9-4V7M3 7l9 4m0 0l9-4m-9 4v11"/></svg>
      <p>ምንም ዓይነት መጽሐፍ አልተገኘም።</p>
    </div>
  </section>
</main>

<footer>© 2026 አቢሲኒያ ብራና — መብቱ በህግ የተጠበቀ ነው።</footer>

<script>
  let allBooks = [];
  let currentGrade = 'all';

  // sample fallback so the page still shows something if books.json
  // isn't next to this file yet — replace/remove once your real
  // books.json is in place.
  const FALLBACK_BOOKS = [
    { title: "Mathematics Grade 9 Student Textbook", grade: 9, cover: "https://placehold.co/200x260/221b14/cf9f43?text=Math+9", downloadUrl: "#" },
    { title: "General Physics Grade 10", grade: 10, cover: "https://placehold.co/200x260/221b14/cf9f43?text=Physics+10", downloadUrl: "#" },
    { title: "English for Ethiopia Grade 8", grade: 8, cover: "https://placehold.co/200x260/221b14/cf9f43?text=English+8", downloadUrl: "#" },
    { title: "Chemistry Grade 11", grade: 11, cover: "https://placehold.co/200x260/221b14/cf9f43?text=Chemistry+11", downloadUrl: "#" },
    { title: "Biology Grade 12", grade: 12, cover: "https://placehold.co/200x260/221b14/cf9f43?text=Biology+12", downloadUrl: "#" },
  ];

  async function loadBooks(){
    try{
      const res = await fetch('books.json');
      if(!res.ok) throw new Error('no books.json');
      allBooks = await res.json();
    }catch(err){
      console.warn('books.json ማግኘት አልተቻለም፣ የናሙና ዝርዝር ታይቷል፦', err);
      allBooks = FALLBACK_BOOKS;
    }
    renderShelves(allBooks);
  }

  function svgDownloadIcon(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>';
  }

  function bookCardHTML(book){
    return `
      <div class="book">
        <div class="cover">
          <span class="grade-chip">${book.grade}ኛ</span>
          <img src="${book.cover}" alt="${book.title}" loading="lazy">
        </div>
        <div class="book-title">${book.title}</div>
        <a class="download-link" href="${book.downloadUrl}" target="_blank" rel="noopener">
          ${svgDownloadIcon()}<span>አውርድ</span>
        </a>
      </div>`;
  }

  function renderShelves(books){
    const container = document.getElementById('shelves');
    const emptyState = document.getElementById('emptyState');
    container.innerHTML = '';

    if(books.length === 0){
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    if(currentGrade === 'all' && !document.getElementById('searchInput').value.trim()){
      const grades = [...new Set(books.map(b => b.grade))].sort((a,b) => a-b);
      grades.forEach(g => {
        const shelfBooks = books.filter(b => b.grade === g);
        container.innerHTML += `
          <div class="shelf">
            <div class="shelf-head">
              <h3>${g}ኛ ክፍል</h3>
              <span class="count">${shelfBooks.length} መጻሕፍት</span>
            </div>
            <div class="book-row">${shelfBooks.map(bookCardHTML).join('')}</div>
          </div>`;
      });
    } else {
      container.innerHTML = `
        <div class="shelf">
          <div class="shelf-head">
            <h3>${currentGrade === 'all' ? 'የፍለጋ ውጤት' : currentGrade + 'ኛ ክፍል'}</h3>
            <span class="count">${books.length} መጻሕፍት</span>
          </div>
          <div class="book-row">${books.map(bookCardHTML).join('')}</div>
        </div>`;
    }
  }

  function filterGrade(grade){
    currentGrade = grade;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-tab'));
    const activeBtn = document.getElementById(`btn-${grade}`);
    if(activeBtn) activeBtn.classList.add('active-tab');
    filterBooks();
  }

  function filterBooks(){
    const search = document.getElementById('searchInput').value.toLowerCase().trim();
    const filtered = allBooks.filter(b => {
      const matchesGrade = currentGrade === 'all' || b.grade.toString() === currentGrade;
      const matchesSearch = !search || b.title.toLowerCase().includes(search);
      return matchesGrade && matchesSearch;
    });
    renderShelves(filtered);
  }

  function scrollToLibrary(grade){
    if(grade && grade !== 'all') filterGrade(grade);
    document.getElementById('library').scrollIntoView({ behavior: 'smooth' });
  }

  function selectGradeAndScroll(grade){
    filterGrade(grade);
    scrollToLibrary();
  }

  function resetHome(){
    filterGrade('all');
    document.getElementById('searchInput').value = '';
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  loadBooks();
</script>
</body>
        </html>
