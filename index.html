<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abisiniya Student Books</title>
    <!-- AdsGram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 20px;
            margin-top: 8px;
            color: #60a5fa;
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        .filter-btn {
            background: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .books-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .book-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .book-cover {
            width: 50px;
            height: 50px;
            margin: 0 auto 10px auto;
            object-fit: contain;
        }

        .book-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.4;
            height: 36px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .btn-download {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .loading {
            text-align: center;
            color: var(--text-sub);
            grid-column: span 2;
            padding: 40px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 Abisiniya Student Library</h1>
    </header>

    <input type="text" id="searchInput" class="search-box" placeholder="መጽሐፍ በስም ይፈልጉ..." oninput="filterBooks()">

    <div class="filter-buttons">
        <button class="filter-btn active" onclick="setGrade('all', this)">ሁሉም</button>
        <button class="filter-btn" onclick="setGrade('9', this)">9ኛ ክፍል</button>
        <button class="filter-btn" onclick="setGrade('10', this)">10ኛ ክፍል</button>
        <button class="filter-btn" onclick="setGrade('11', this)">11ኛ ክፍል</button>
        <button class="filter-btn" onclick="setGrade('12', this)">12ኛ ክፍል</button>
    </div>

    <div class="books-grid" id="booksGrid">
        <div class="loading">መጻሕፍት በመጫን ላይ ናቸው...</div>
    </div>

    <script>
        let allBooks = [];
        let selectedGrade = 'all';

        // Fetch books from books.json
        fetch('books.json')
            .then(res => res.json())
            .then(data => {
                allBooks = data;
                renderBooks();
            })
            .catch(err => {
                document.getElementById('booksGrid').innerHTML = '<div class="loading">መጻሕፍቱን መጫን አልተቻለም።</div>';
            });

        function renderBooks() {
            const grid = document.getElementById('booksGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = allBooks.filter(book => {
                const matchesGrade = selectedGrade === 'all' || book.grade === selectedGrade;
                const matchesSearch = book.title.toLowerCase().includes(search);
                return matchesGrade && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="loading">ምንም መጽሐፍ አልተገኘም።</div>';
                return;
            }

            filtered.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <img src="${book.cover}" class="book-cover" alt="Cover">
                    <div class="book-title">${book.title}</div>
                    <button class="btn-download" onclick="downloadWithAd('${book.downloadUrl}')">
                        📥 አውርድ (Ad)
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function setGrade(grade, btn) {
            selectedGrade = grade;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderBooks();
        }

        function filterBooks() {
            renderBooks();
        }

        function downloadWithAd(downloadUrl) {
            // AdsGram integration with Block ID 46561
            const AdController = window.Adsgram.init({ blockId: "46561" });
            AdController.show().then(() => {
                window.location.href = downloadUrl;
            }).catch((err) => {
                window.location.href = downloadUrl;
            });
        }
    </script>
</body>
</html>
