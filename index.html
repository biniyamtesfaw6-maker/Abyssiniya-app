<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abyssiniya Student Book</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .active-tab {
      background: #2563eb !important;
      color: white !important;
      box-shadow: 0 4px 14px 0 rgba(37, 99, 235, 0.39);
    }
  </style>
</head>
<body class="pb-10">

  <!-- Header & Logo -->
  <header class="p-5 text-center flex flex-col items-center justify-center border-b border-slate-800">
    <div class="w-24 h-24 rounded-full p-1 bg-gradient-to-tr from-amber-500 via-green-500 to-red-500 mb-3 shadow-lg">
      <!-- ሎጎህ ከላይ ይታያል -->
      <img src="https://raw.githubusercontent.com/yirga-tesfaw/digital-library/main/logo.png" alt="Logo" class="w-full h-full object-cover rounded-full bg-slate-900" id="logoImg" onerror="this.src='https://img.icons8.com/color/96/book.png'">
    </div>
    <h1 class="text-2xl font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
      Abyssiniya Student Book
    </h1>
    <p class="text-xs text-slate-400 mt-1">የ9-12ኛ ክፍል ዲጂታል መጻሕፍት ቤተ-መጻሕፍት</p>
  </header>

  <!-- Search & Filter Section -->
  <div class="p-4 max-w-md mx-auto sticky top-0 z-10 bg-slate-900/90 backdrop-blur-md">
    <!-- Search Bar -->
    <div class="relative mb-4">
      <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
      <input type="text" id="searchInput" placeholder="መጽሐፍ በስም ፈልግ..." class="w-full pl-11 pr-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm focus:outline-none focus:border-blue-500 transition">
    </div>

    <!-- Grade Filter Tabs -->
    <div class="flex justify-between gap-1 bg-slate-800/60 p-1.5 rounded-xl text-xs font-semibold">
      <button onclick="filterGrade('all')" class="tab-btn active-tab flex-1 py-2 rounded-lg transition">ሁሉም</button>
      <button onclick="filterGrade('9')" class="tab-btn flex-1 py-2 rounded-lg transition text-slate-400">9ኛ</button>
      <button onclick="filterGrade('10')" class="tab-btn flex-1 py-2 rounded-lg transition text-slate-400">10ኛ</button>
      <button onclick="filterGrade('11')" class="tab-btn flex-1 py-2 rounded-lg transition text-slate-400">11ኛ</button>
      <button onclick="filterGrade('12')" class="tab-btn flex-1 py-2 rounded-lg transition text-slate-400">12ኛ</button>
    </div>
  </div>

  <!-- Book Container -->
  <main class="p-4 max-w-md mx-auto">
    <div id="bookGrid" class="grid grid-cols-2 gap-3">
      <!-- Books will load dynamically here -->
    </div>
  </main>

  <script>
    let allBooks = [];
    let currentGrade = 'all';

    // Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Fetch Books Data
    async function loadBooks() {
      try {
        const response = await fetch('books.json');
        allBooks = await response.json();
        renderBooks();
      } catch (error) {
        console.error('Error loading books:', error);
      }
    }

    // Render Books Function
    function renderBooks() {
      const grid = document.getElementById('bookGrid');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      
      grid.innerHTML = '';

      const filteredBooks = allBooks.filter(book => {
        const matchesGrade = currentGrade === 'all' || book.grade === currentGrade;
        const matchesSearch = book.title.toLowerCase().includes(searchTerm);
        return matchesGrade && matchesSearch;
      });

      if (filteredBooks.length === 0) {
        grid.innerHTML = `<div class="col-span-2 text-center text-slate-500 py-10">ምንም መጽሐፍ አልተገኘም</div>`;
        return;
      }

      filteredBooks.forEach(book => {
        const card = document.createElement('div');
        card.className = 'glass-card rounded-2xl p-3 flex flex-col items-center justify-between text-center hover:border-blue-500/50 transition';
        card.innerHTML = `
          <div class="w-16 h-16 mb-2 flex items-center justify-center bg-slate-800 rounded-xl p-2">
            <img src="${book.cover}" alt="${book.title}" class="w-full h-full object-contain">
          </div>
          <h3 class="text-xs font-semibold mb-1 line-clamp-2 text-slate-200">${book.title}</h3>
          <span class="text-[10px] bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded-full mb-3">Grade ${book.grade}</span>
          <button onclick="downloadBook('${book.downloadUrl}')" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs py-2 rounded-xl font-medium shadow-md transition flex items-center justify-center gap-1">
            <i class="fa-solid fa-download"></i> አውርድ
          </button>
        `;
        grid.appendChild(card);
      });
    }

    // Download Handler (Direct Transfer)
    function downloadBook(url) {
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(url);
      } else {
        window.open(url, '_blank');
      }
    }

    // Filter Logic
    function filterGrade(grade) {
      currentGrade = grade;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-tab', 'text-white'));
      event.target.classList.add('active-tab');
      renderBooks();
    }

    // Search Listener
    document.getElementById('searchInput').addEventListener('input', renderBooks);

    // Initial Load
    loadBooks();
  </script>
</body>
</html>
