<!DOCTYPE html>
<html lang="am" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abyssiniya Student Book - አቢሲኒያ ዲጂታል መጻሕፍት ቤት</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts (Noto Sans Ethiopic) -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans Ethiopic', sans-serif;
    }
    /* Custom Button & Card Animations */
    .btn-bounce:hover {
      transform: translateY(-3px) scale(1.02);
    }
    .btn-bounce:active {
      transform: translateY(1px) scale(0.98);
    }
    .card-hover {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-hover:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 24px -10px rgba(99, 102, 241, 0.3);
    }
    .glow-effect {
      box-shadow: 0 0 20px rgba(79, 70, 229, 0.4);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white flex flex-col justify-between">

  <!-- Top Navigation Header -->
  <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800/80 px-4 py-3.5">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <a href="#" onclick="showHomePage()" class="flex items-center gap-2.5 group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg group-hover:scale-105 transition-transform">
          <i class="fa-solid fa-book-open text-lg"></i>
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight text-white leading-tight">Abyssiniya Book</h1>
          <p class="text-[10px] text-indigo-400 font-medium">ዲጂታል ቤተ-መጻሕፍት</p>
        </div>
      </a>
      
      <button onclick="scrollToLibrary()" class="btn-bounce bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-xl shadow-md transition-all flex items-center gap-2">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>መጻሕፍት</span>
      </button>
    </div>
  </header>

  <main class="flex-grow">
    <!-- ================= HERO HOME PAGE SECTION ================= -->
    <section id="homeSection" class="relative overflow-hidden py-12 px-4 sm:py-16">
      <!-- Background Glow -->
      <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

      <div class="max-w-4xl mx-auto text-center relative z-10">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 mb-4 animate-pulse">
          <i class="fa-solid fa-sparkles text-indigo-400"></i> አዲስ የ8ኛ - 12ኛ ክፍል መጻሕፍት ተካተዋል
        </span>
        
        <h2 class="text-3xl sm:text-5xl font-extrabold text-white leading-tight mb-4">
          የትምህርት መጻሕፍትን በቅጽበት <br class="hidden sm:inline">
          <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400">በቀላሉ ያውርዱ</span>
        </h2>
        
        <p class="text-slate-400 text-sm sm:text-base max-w-xl mx-auto mb-8 font-normal leading-relaxed">
          የኢትዮጵያ አዲሱን የትምህርት ሥርዓት መጻሕፍት በየክፍሉ በተደራጀ መልኩ እዚህ ያገኛሉ። በቴሌግራም ቀጥታ ማውረድ ይችላሉ።
        </p>

        <!-- Main CTA Buttons -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3 mb-12">
          <button onclick="scrollToLibrary('all')" class="btn-bounce w-full sm:w-auto bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold px-7 py-3.5 rounded-2xl shadow-lg glow-effect transition-all flex items-center justify-center gap-2 text-sm">
            <span>ሁሉንም መጻሕፍት ይመልከቱ</span>
            <i class="fa-solid fa-arrow-down"></i>
          </button>
        </div>

        <!-- Quick Grade Selection Grid -->
        <div class="mt-8">
          <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">ክፍል መረጣ</h3>
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 max-w-3xl mx-auto">
            <button onclick="selectGradeAndScroll('8')" class="card-hover bg-slate-900/90 border border-slate-800 hover:border-indigo-500/50 p-4 rounded-2xl text-center group cursor-pointer">
              <div class="w-10 h-10 mx-auto mb-2 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center font-bold text-lg group-hover:bg-indigo-600 group-hover:text-white transition-colors">8</div>
              <span class="text-xs font-semibold text-slate-200 block">8ኛ ክፍል</span>
            </button>
            <button onclick="selectGradeAndScroll('9')" class="card-hover bg-slate-900/90 border border-slate-800 hover:border-indigo-500/50 p-4 rounded-2xl text-center group cursor-pointer">
              <div class="w-10 h-10 mx-auto mb-2 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center font-bold text-lg group-hover:bg-indigo-600 group-hover:text-white transition-colors">9</div>
              <span class="text-xs font-semibold text-slate-200 block">9ኛ ክፍል</span>
            </button>
            <button onclick="selectGradeAndScroll('10')" class="card-hover bg-slate-900/90 border border-slate-800 hover:border-indigo-500/50 p-4 rounded-2xl text-center group cursor-pointer">
              <div class="w-10 h-10 mx-auto mb-2 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center font-bold text-lg group-hover:bg-indigo-600 group-hover:text-white transition-colors">10</div>
              <span class="text-xs font-semibold text-slate-200 block">10ኛ ክፍል</span>
            </button>
            <button onclick="selectGradeAndScroll('11')" class="card-hover bg-slate-900/90 border border-slate-800 hover:border-indigo-500/50 p-4 rounded-2xl text-center group cursor-pointer">
              <div class="w-10 h-10 mx-auto mb-2 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center font-bold text-lg group-hover:bg-indigo-600 group-hover:text-white transition-colors">11</div>
              <span class="text-xs font-semibold text-slate-200 block">11ኛ ክፍል</span>
            </button>
            <button onclick="selectGradeAndScroll('12')" class="card-hover bg-slate-900/90 border border-slate-800 hover:border-indigo-500/50 p-4 rounded-2xl text-center group cursor-pointer col-span-2 sm:col-span-1">
              <div class="w-10 h-10 mx-auto mb-2 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center font-bold text-lg group-hover:bg-indigo-600 group-hover:text-white transition-colors">12</div>
              <span class="text-xs font-semibold text-slate-200 block">12ኛ ክፍል</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= BOOKS LIBRARY SECTION ================= -->
    <section id="librarySection" class="max-w-5xl mx-auto px-4 py-8 border-t border-slate-800/60">
      
      <!-- Sticky Filter Bar -->
      <div class="bg-slate-900/90 backdrop-blur-md p-4 rounded-2xl border border-slate-800 mb-8 sticky top-16 z-40 shadow-xl">
        
        <!-- Search Input -->
        <div class="relative mb-3">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400 text-sm"></i>
          <input type="text" id="searchInput" oninput="filterBooks()" placeholder="የመጽሐፍ ስም ፈልግ (ለምሳሌ፡ Maths, Physics...)" class="w-full bg-slate-950 border border-slate-700/80 rounded-xl pl-11 pr-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-500 transition-all">
        </div>

        <!-- Grade Filter Tabs -->
        <div class="flex items-center gap-1.5 bg-slate-950 p-1.5 rounded-xl border border-slate-800/80 overflow-x-auto text-xs font-medium">
          <button onclick="filterGrade('all')" id="btn-all" class="tab-btn active-tab flex-1 py-2 px-3 rounded-lg transition-all whitespace-nowrap text-center bg-indigo-600 text-white font-bold">ሁሉም</button>
          <button onclick="filterGrade('8')" id="btn-8" class="tab-btn flex-1 py-2 px-3 rounded-lg transition-all text-slate-400 hover:text-white whitespace-nowrap text-center">8ኛ ክፍል</button>
          <button onclick="filterGrade('9')" id="btn-9" class="tab-btn flex-1 py-2 px-3 rounded-lg transition-all text-slate-400 hover:text-white whitespace-nowrap text-center">9ኛ ክፍል</button>
          <button onclick="filterGrade('10')" id="btn-10" class="tab-btn flex-1 py-2 px-3 rounded-lg transition-all text-slate-400 hover:text-white whitespace-nowrap text-center">10ኛ ክፍል</button>
          <button onclick="filterGrade('11')" id="btn-11" class="tab-btn flex-1 py-2 px-3 rounded-lg transition-all text-slate-400 hover:text-white whitespace-nowrap text-center">11ኛ ክፍል</button>
          <button onclick="filterGrade('12')" id="btn-12" class="tab-btn flex-1 py-2 px-3 rounded-lg transition-all text-slate-400 hover:text-white whitespace-nowrap text-center">12ኛ ክፍል</button>
        </div>
      </div>

      <!-- Books Grid Header -->
      <div class="flex items-center justify-between mb-4 px-1">
        <h3 id="currentCategoryTitle" class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-layer-group text-indigo-400"></i> ሁሉም መጻሕፍት
        </h3>
        <span id="bookCount" class="text-xs text-indigo-400 font-semibold bg-indigo-500/10 px-2.5 py-1 rounded-full border border-indigo-500/20">0 መጻሕፍት</span>
      </div>

      <!-- Books Display Grid -->
      <div id="bookGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 sm:gap-6">
        <!-- Books will load dynamically here -->
      </div>

      <!-- Empty State Message -->
      <div id="emptyState" class="hidden text-center py-12">
        <i class="fa-solid fa-folder-open text-4xl text-slate-600 mb-3"></i>
        <p class="text-slate-400 text-sm">ምንም ዓይነት መጽሐፍ አልተገኘም።</p>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 border-t border-slate-800 text-center py-6 px-4 mt-12 text-slate-500 text-xs">
    <p>© 2026 Abyssiniya Student Book. መብቱ በህግ የተጠበቀ ነው።</p>
  </footer>

  <!-- JavaScript Code -->
  <script>
    let allBooks = [];
    let currentGrade = 'all';

    // Fetch JSON Data
    async function loadBooks() {
      try {
        const res = await fetch('books.json');
        allBooks = await res.json();
        renderBooks(allBooks);
      } catch (err) {
        console.error('መጻሕፍቱን መጫን አልተቻለም:', err);
      }
    }

    // Render Books Grid
    function renderBooks(books) {
      const grid = document.getElementById('bookGrid');
      const emptyState = document.getElementById('emptyState');
      const bookCount = document.getElementById('bookCount');
      grid.innerHTML = '';

      bookCount.textContent = `${books.length} መጻሕፍት`;

      if (books.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      } else {
        emptyState.classList.add('hidden');
      }

      books.forEach(book => {
        const card = document.createElement('div');
        card.className = "card-hover bg-slate-900 border border-slate-800/80 rounded-2xl p-3.5 flex flex-col justify-between hover:border-indigo-500/40 transition-all";
        
        card.innerHTML = `
          <div>
            <div class="bg-slate-950/80 rounded-xl p-3 mb-3 flex items-center justify-center h-28 border border-slate-800/50">
              <img src="${book.cover}" alt="${book.title}" class="h-20 w-auto object-contain drop-shadow-md">
            </div>
            <span class="inline-block px-2 py-0.5 text-[10px] font-bold text-indigo-400 bg-indigo-500/10 rounded-md border border-indigo-500/20 mb-1.5">
              ${book.grade}ኛ ክፍል
            </span>
            <h4 class="text-xs font-bold text-slate-100 line-clamp-2 leading-snug mb-3">${book.title}</h4>
          </div>
          <a href="${book.downloadUrl}" target="_blank" class="btn-bounce w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold text-xs py-2 rounded-xl transition-all flex items-center justify-center gap-1.5 shadow-md">
            <i class="fa-solid fa-download"></i>
            <span>አውርድ</span>
          </a>
        `;
        grid.appendChild(card);
      });
    }

    // Filter Grade Function
    function filterGrade(grade) {
      currentGrade = grade;
      
      // Update Tab Styles
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'text-white', 'font-bold');
        btn.classList.add('text-slate-400');
      });
      
      const activeBtn = document.getElementById(`btn-${grade}`);
      if(activeBtn) {
        activeBtn.classList.add('bg-indigo-600', 'text-white', 'font-bold');
        activeBtn.classList.remove('text-slate-400');
      }

      // Update Title
      const title = document.getElementById('currentCategoryTitle');
      title.innerHTML = grade === 'all' 
        ? `<i class="fa-solid fa-layer-group text-indigo-400"></i> ሁሉም መጻሕፍት` 
        : `<i class="fa-solid fa-graduation-cap text-indigo-400"></i> የ ${grade}ኛ ክፍል መጻሕፍት`;

      filterBooks();
    }

    // Filter Books Search & Grade
    function filterBooks() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allBooks.filter(b => {
        const matchesGrade = currentGrade === 'all' || b.grade.toString() === currentGrade;
        const matchesSearch = b.title.toLowerCase().includes(search);
        return matchesGrade && matchesSearch;
      });
      renderBooks(filtered);
    }

    // Smooth Scroll Helpers
    function scrollToLibrary(grade = 'all') {
      if(grade !== 'all') filterGrade(grade);
      document.getElementById('librarySection').scrollIntoView({ behavior: 'smooth' });
    }

    function selectGradeAndScroll(grade) {
      filterGrade(grade);
      scrollToLibrary(grade);
    }

    // Initialize
    loadBooks();
  </script>
</body>
</html>
