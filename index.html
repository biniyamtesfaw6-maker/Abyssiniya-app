<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abisiniya Student Books</title>
    <!-- AdsGram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .icon-box {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 32px;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 28px;
        }

        .feature-card {
            background-color: rgba(255, 255, 255, 0.03);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .feature-card span {
            font-size: 20px;
            display: block;
            margin-bottom: 4px;
        }

        .feature-card p {
            font-size: 12px;
            color: var(--text-sub);
        }

        .btn-ad {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-ad:active {
            transform: scale(0.98);
        }

        .footer-note {
            margin-top: 18px;
            font-size: 11px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">📚</div>
        <h1>Abisiniya Student Books</h1>
        <p class="subtitle">እንኳን ወደ አቢሲኒያ የተማሪዎች መጻሕፍት ማውረጃ ቦት በደህና መጡ!</p>

        <div class="features">
            <div class="feature-card">
                <span>📖</span>
                <p>የሁሉም ክፍል መጻሕፍት</p>
            </div>
            <div class="feature-card">
                <span>⚡</span>
                <p>ፈጣን ማውረጃ</p>
            </div>
        </div>

        <button class="btn-ad" onclick="showAd()">
            <span>▶</span> ማስታወቂያ ይመልከቱ
        </button>

        <p class="footer-note">ማስታወቂያ በመመልከት የቦታችንን አገልግሎት ይደግፉ።</p>
    </div>

    <script>
        function showAd() {
            const AdController = window.Adsgram.init({ blockId: "bot-46561" });
            AdController.show().then(() => {
                alert("እናመሰግናለን! ማስታወቂያውን ስለተመለከቱ እናመሰግናለን።");
            }).catch((err) => {
                alert("ማስታወቂያ መጫን አልተቻለም። እባክዎ እንደገና ይሞክሩ።");
            });
        }
    </script>
</body>
</html>
